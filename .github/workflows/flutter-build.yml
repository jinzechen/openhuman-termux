name: Build OpenHuman APK

on:
  push:
    branches: ['*']
    paths:
      - 'flutter_app/**'
      - 'scripts/**'
      - '.github/workflows/flutter-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('flutter_app/android/**/*.gradle*') }}

      - name: Fetch PRoot binaries
        run: bash scripts/fetch-proot-binaries.sh

      - name: Get dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build APK (all ABIs)
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Build per-ABI APKs
        working-directory: flutter_app
        run: flutter build apk --release --split-per-abi

      - name: Collect artifacts
        run: |
          VERSION=$(grep '^version:' flutter_app/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          mkdir -p artifacts
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk \
             "artifacts/OpenHuman-v${VERSION}-universal.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            SRC="flutter_app/build/app/outputs/flutter-apk/app-${abi}-release.apk"
            [ -f "$SRC" ] && cp "$SRC" "artifacts/OpenHuman-v${VERSION}-${abi}.apk"
          done
          ls -lh artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: openhuman-apks
          path: artifacts/*.apk
          retention-days: 30
